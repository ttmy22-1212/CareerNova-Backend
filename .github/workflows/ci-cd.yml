name: CareerNova Backend CI/CD

# Kích hoạt pipeline mỗi khi push code lên branch main
on:
  push:
    branches: ['main']

jobs:
  # # STAGE 1: LINT
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout source code
  #       uses: actions/checkout@v4

  #     - name: Setup Node.js môi trường
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: 'yarn'

  #     - name: Install dependencies bằng Yarn
  #       run: yarn install --frozen-lockfile

  #     - name: Run Lint Check
  #       run: yarn lint

  # STAGE 2: BUILD IMAGE & PUSH DOCKER HUB
  build-and-push:
    # needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          pull: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/careernova-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/careernova-backend:${{ github.sha }}
