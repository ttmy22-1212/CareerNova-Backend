version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: career_nova
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_nova
    ports:
      - '5432:5432'
    volumes:
      - career_nova_postgres_data:/var/lib/postgresql/data

  # redis:
  #   image: redis:7
  #   container_name: redis_app
  #   ports:
  #     - '6379:6379'
